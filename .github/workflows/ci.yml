name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
          uv pip install --system -r server/requirements.txt
          uv pip install --system ruff mypy pytest pytest-asyncio pytest-cov
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: mypy server tests

  frontend-build:
    name: Frontend Build (React TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and Build Client
        run: |
          cd client
          npm install
          npm run build

  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Start Redis
        run: |
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
          uv pip install --system -r server/requirements.txt
          uv pip install --system pytest pytest-asyncio pytest-cov httpx
      - name: Run Unit Tests
        run: pytest tests/unit -v
      - name: Run Contract Tests (Mock)
        run: pytest tests/contract -k mock -v
      - name: Run Integration Tests
        run: pytest tests/integration -v

